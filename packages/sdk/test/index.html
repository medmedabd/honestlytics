<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Honestlytics - sdk test</h1>

    <div class="section-label">sdk tracking</div>
    <div class="buttons">
      <button class="btn primary" onclick="trackSingle()">track single</button>
      <button class="btn" onclick="trackBatch()">track batch (5)</button>
      <button class="btn" onclick="trackMaxBatch()">
        track max batch (20)
      </button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">queue size</div>
        <div class="stat-value" id="stat-queue">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">sent total</div>
        <div class="stat-value" id="stat-sent">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">retries</div>
        <div class="stat-value" id="stat-retry">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">failed</div>
        <div class="stat-value" id="stat-failed">0</div>
      </div>
    </div>

    <div class="section-label">analytics endpoints</div>
    <div class="buttons">
      <button class="btn accent" onclick="testAll()">test all</button>
      <button class="btn" onclick="testSummary()">summary</button>
      <button class="btn" onclick="testPageviews()">pageviews</button>
      <button class="btn" onclick="testEvents()">events</button>
      <button class="btn" onclick="testEventsByName()">events by name</button>
      <button class="btn" onclick="testSessions()">sessions</button>
      <button class="btn" onclick="testUniqueUsers()">unique users</button>
      <button class="btn" onclick="testSessionDuration()">
        session duration
      </button>
    </div>

    <div class="console-header">
      <span class="console-title">event log</span>
      <button class="clear-btn" onclick="clearLogs()">clear</button>
    </div>
    <div class="console" id="console"></div>

    <script src="/dist/honestlytics.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
